# Guild Wars 2 Profile
# Optimized for action combat with dodge mechanics

game:
  id: "guild_wars_2"
  name: "Guild Wars 2"
  publisher: "ArenaNet / NCSoft"

display:
  typical_resolution: [1920, 1080]
  ui_scale_range: [0.75, 1.25]
  important_regions:
    health_bar: [0.42, 0.88, 0.16, 0.04]
    skill_bar: [0.30, 0.92, 0.40, 0.07]
    minimap: [0.82, 0.70, 0.17, 0.28]
    center_focus: [0.30, 0.25, 0.40, 0.50]

# ---------------------------------------------------------------------------
# Pipeline contract (bot_mmorpg.config.action_mapping)
#
# The action vector is fixed by the pipeline, not by this game:
#   slots  0-8   keyboard  (W, S, A, D, WA, WD, SA, SD, no_keys)
#   slots  9-28  gamepad   (10 implemented, 10 reported as unmapped)
#   slots 29-38  mouse     (x, y, dx, dy, vx, vy, lmb, rmb, mmb, scroll) -- only with --mouse
#
# Frames are captured and fed to the network at 480x270. Both collect_data.py
# and test_model.py hardcode that size and train_model.py does not rescale,
# so a different value here cannot be honoured.
#
# The per-game part of this file is `default_bindings` below: which physical
# key plays which role. Recording, training and inference all read the action
# space; nothing here changes the slot order.
# ---------------------------------------------------------------------------
input:
  action_space: "standard"
  num_actions: 29  # 9 keyboard + 20 gamepad (39 with --mouse)
  requires_mouse: true
  mouse_precision: "medium"
  default_bindings:
    - {key: "1", action: "weapon_1"}
    - {key: "2", action: "weapon_2"}
    - {key: "3", action: "weapon_3"}
    - {key: "4", action: "weapon_4"}
    - {key: "5", action: "weapon_5"}
    - {key: "6", action: "heal"}
    - {key: "7", action: "utility_1"}
    - {key: "8", action: "utility_2"}
    - {key: "9", action: "utility_3"}
    - {key: "0", action: "elite"}
    - {key: "W", action: "move_forward"}
    - {key: "A", action: "move_left"}
    - {key: "S", action: "move_back"}
    - {key: "D", action: "move_right"}
    - {key: "V", action: "dodge"}

training:
  recommended_architecture: "efficientnet_lstm"
  recommended_input_size: [480, 270]
  temporal_frames: 6
  minimum_samples: 8000
  class_balance_tolerance: 0.2
  learning_rate:
    initial: 0.0006
    decay_factor: 0.1
    decay_epochs: [20, 40]

hardware_tiers:
  low:
    architecture: "mobilenetv3"
    batch_size: 6
    input_size: [480, 270]
    temporal_frames: 0
    workers: 2
  medium:
    architecture: "efficientnet_lstm"
    batch_size: 12
    input_size: [480, 270]
    temporal_frames: 4
    workers: 4
  high:
    architecture: "efficientnet_lstm"
    batch_size: 24
    input_size: [480, 270]
    temporal_frames: 6
    workers: 8

tasks:
  combat:
    description: "Action combat with dodge timing"
    priority: "reaction_time"
    temporal: true
    recommended_architecture: "efficientnet_lstm"
    augmentation: [brightness, contrast, noise]
    fps_target: 45
  farming:
    description: "Material gathering and events"
    priority: "accuracy"
    temporal: false
    recommended_architecture: "mobilenetv3"
    augmentation: [rotation, brightness]
    fps_target: 20
  world_boss:
    description: "Large-scale boss encounters"
    priority: "reaction_time"
    temporal: true
    recommended_architecture: "efficientnet_lstm"
    augmentation: [brightness, contrast]
    fps_target: 30
