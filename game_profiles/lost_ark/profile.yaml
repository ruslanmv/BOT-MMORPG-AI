# Lost Ark Profile
# Optimized for isometric action combat

game:
  id: "lost_ark"
  name: "Lost Ark"
  publisher: "Smilegate / Amazon Games"

display:
  typical_resolution: [1920, 1080]
  ui_scale_range: [0.80, 1.20]
  important_regions:
    health_bar: [0.40, 0.92, 0.20, 0.03]
    skill_bar: [0.32, 0.88, 0.36, 0.08]
    minimap: [0.84, 0.01, 0.15, 0.22]
    center_focus: [0.25, 0.20, 0.50, 0.60]

# ---------------------------------------------------------------------------
# Pipeline contract (bot_mmorpg.config.action_mapping)
#
# The action vector is fixed by the pipeline, not by this game:
#   slots  0-8   keyboard  (W, S, A, D, WA, WD, SA, SD, no_keys)
#   slots  9-28  gamepad   (10 implemented, 10 reported as unmapped)
#   slots 29-38  mouse     (x, y, dx, dy, vx, vy, lmb, rmb, mmb, scroll) -- only with --mouse
#
# Frames are captured and fed to the network at 480x270. Both collect_data.py
# and test_model.py hardcode that size and train_model.py does not rescale,
# so a different value here cannot be honoured.
#
# The per-game part of this file is `default_bindings` below: which physical
# key plays which role. Recording, training and inference all read the action
# space; nothing here changes the slot order.
# ---------------------------------------------------------------------------
input:
  action_space: "standard"
  num_actions: 29  # 9 keyboard + 20 gamepad (39 with --mouse)
  requires_mouse: true
  mouse_precision: "high"
  default_bindings:
    - {key: "Q", action: "skill_1"}
    - {key: "W", action: "skill_2"}
    - {key: "E", action: "skill_3"}
    - {key: "R", action: "skill_4"}
    - {key: "A", action: "skill_5"}
    - {key: "S", action: "skill_6"}
    - {key: "D", action: "skill_7"}
    - {key: "F", action: "skill_8"}
    - {key: "SPACE", action: "dodge"}
    - {key: "Z", action: "awakening"}
    - {key: "mouse_left", action: "move"}
    - {key: "mouse_right", action: "basic_attack"}

training:
  recommended_architecture: "efficientnet_lstm"
  recommended_input_size: [480, 270]
  temporal_frames: 6
  minimum_samples: 10000
  class_balance_tolerance: 0.2
  learning_rate:
    initial: 0.0005
    decay_factor: 0.1
    decay_epochs: [20, 40]

hardware_tiers:
  low:
    architecture: "mobilenetv3"
    batch_size: 6
    input_size: [480, 270]
    temporal_frames: 0
    workers: 2
  medium:
    architecture: "efficientnet_lstm"
    batch_size: 12
    input_size: [480, 270]
    temporal_frames: 4
    workers: 4
  high:
    architecture: "efficientnet_lstm"
    batch_size: 24
    input_size: [480, 270]
    temporal_frames: 6
    workers: 8

tasks:
  combat:
    description: "Isometric combat with skill combos"
    priority: "reaction_time"
    temporal: true
    recommended_architecture: "efficientnet_lstm"
    augmentation: [brightness, contrast, noise]
    fps_target: 60
  chaos_dungeon:
    description: "Fast-paced dungeon clearing"
    priority: "reaction_time"
    temporal: true
    recommended_architecture: "efficientnet_lstm"
    augmentation: [brightness, contrast]
    fps_target: 45
  guardian_raid:
    description: "Boss mechanics and patterns"
    priority: "reaction_time"
    temporal: true
    recommended_architecture: "efficientnet_lstm"
    augmentation: [brightness, contrast, noise]
    fps_target: 30
