name: Build Windows Installer

# IMPORTANT: this workflow is the CI/PR/master-nightly path. It does NOT
# trigger on `v*` tags. Tagged releases are owned by
# release-windows-installer.yml -- running both on a tag attached two .exe
# files to the same release page (a real ~600 MB installer plus a ~108 KB
# stub from when this workflow used PyInstaller). One workflow per release
# asset stream avoids that duplication.
on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: "always"

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Compute the semver injected into tauri's package.version. Driver:
      #   tag push      -> 0.2.2          (from refs/tags/v0.2.2)
      #   master push   -> 0.0.0-nightly.<utc>.g<sha>   (semver pre-release)
      #   develop push  -> 0.0.0-dev.<utc>.g<sha>
      #   pull_request  -> 0.0.0-pr.<n>.g<sha>
      # Pre-release identifiers contain only [0-9A-Za-z.-] (no '+').
      # The short SHA is prefixed with 'g' (git-describe convention) so the
      # identifier is alphanumeric. Without the prefix, an all-digit SHA that
      # starts with 0 (e.g. "0378990") is a purely numeric pre-release
      # identifier, which semver §9 forbids ("MUST NOT include leading
      # zeroes") -- Tauri then rejects it with
      # "Error `package > version` must be a semver string".
      - name: Compute build semver
        id: ver
        shell: bash
        run: |
          set -e
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          stamp=$(date -u +%Y%m%d%H%M)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            v="${GITHUB_REF#refs/tags/}"
            v="${v#v}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            v="0.0.0-pr.${{ github.event.pull_request.number }}.g${short}"
          elif [[ "${GITHUB_REF}" == refs/heads/master ]]; then
            v="0.0.0-nightly.${stamp}.g${short}"
          elif [[ "${GITHUB_REF}" == refs/heads/develop ]]; then
            v="0.0.0-dev.${stamp}.g${short}"
          else
            v="0.0.0-ci.${stamp}.g${short}"
          fi

          # Strict semver check (SemVer 2.0.0): rejects leading zeroes in
          # numeric identifiers, which is the bug we just fixed above.
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$v" =~ $semver_re ]]; then
            echo "::error::Computed version '$v' is not valid semver."
            exit 1
          fi

          echo "semver=$v" >> "$GITHUB_OUTPUT"
          echo "Computed semver: $v"

      - name: Setup Python (3.10 -- must match the embedded runtime)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version "^1.0" --force

      # Single source of truth: the same pipeline the Release workflow runs.
      # This guarantees nightly + PR + tagged builds all produce the SAME
      # installer shape (full embedded Python runtime, packed zip, NSIS)
      # rather than a 95 KB PyInstaller stub. The -Version override makes
      # the bundle filename embed the computed version
      # (BOT-MMORPG-AI_<semver>_x64-setup.exe).
      - name: Build installer (Tauri + NSIS via build_pipeline)
        shell: pwsh
        env:
          BOT_BUILD_SEMVER: ${{ steps.ver.outputs.semver }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_pipeline.ps1 -Version "$env:BOT_BUILD_SEMVER"

      - name: Verify installer contents
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify_installer.ps1

      - name: Locate installer EXE
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "No installer EXE found in bundle dir" }

          $expected = "${{ steps.ver.outputs.semver }}"
          if ($exe.Name -notmatch [Regex]::Escape($expected)) {
            throw "Installer filename '$($exe.Name)' missing expected version '$expected'"
          }

          $sizeMB = [math]::Round($exe.Length / 1MB, 1)
          if ($sizeMB -lt 50) {
            throw "Installer is suspiciously small ($sizeMB MB) -- did the Python runtime get bundled? Expected >= 50 MB."
          }

          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($exe.Name)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "[OK] Installer: $($exe.Name) ($sizeMB MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.ver.outputs.semver }}
          path: ${{ steps.installer.outputs.path }}
          retention-days: 30

      # Nightly: auto-publish EXE to a rolling "nightly" release on every master push.
      - name: Upload installer EXE to Nightly Release (every commit on master)
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (latest master build)
          prerelease: true
          generate_release_notes: false
          body: |
            ## Nightly Build

            **This is an automated nightly build from the latest `master` commit.**

            Version: `${{ steps.ver.outputs.semver }}`

            The `.exe` installer below is always up-to-date with the latest code.
            Download it directly -- no need to unzip.

            ### How to install
            1. Download the `.exe` file below
            2. Run it with administrator privileges
            3. Follow the setup wizard

            > **Note:** Nightly builds may contain experimental features.
            > For stable releases, see [tagged releases](../../releases).
          files: ${{ steps.installer.outputs.path }}

  test-installer:
    name: Test Installer
    needs: build-windows
    runs-on: windows-latest
    if: "!startsWith(github.ref, 'refs/tags/')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          pattern: windows-installer-*
          path: ./installer-test
          merge-multiple: true

      - name: Basic installer validation
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path ./installer-test -Recurse -Filter "*.exe"
          if ($installers.Count -eq 0) {
            Write-Error "No installer found!"
            exit 1
          }

          foreach ($installer in $installers) {
            $sizeMB = [math]::Round($installer.Length / 1MB, 1)
            Write-Host "Validating: $($installer.Name) ($sizeMB MB)"

            if ($sizeMB -lt 50) {
              Write-Error "Installer size is suspiciously small ($sizeMB MB) -- expected >= 50 MB."
              exit 1
            }

            # PowerShell 7 does NOT support -Encoding Byte; read raw.
            $bytes  = [System.IO.File]::ReadAllBytes($installer.FullName)
            $header = $bytes[0..1]

            if ($header[0] -eq 0x4D -and $header[1] -eq 0x5A) {
              Write-Host "[OK] Valid PE executable header"
            } else {
              Write-Error "Invalid executable header"
              exit 1
            }
          }
