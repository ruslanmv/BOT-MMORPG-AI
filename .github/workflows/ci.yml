name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  PYTHON_VERSION: "3.10"

jobs:
  # ============================================
  # Code Quality Checks
  # ============================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --dev
          uv pip install ruff mypy

      # Guard: PowerShell scripts invoked by the release workflow run under
      # Windows PowerShell 5.1, which mis-decodes UTF-8 source files without
      # a BOM (symbols like check-marks become CP-1252 mojibake, the string
      # parser chokes, function definitions never register, and later calls
      # fail with "Write-Info is not recognized"). Keep every .ps1 ASCII-only.
      - name: PowerShell scripts must be ASCII
        shell: bash
        run: |
          set -e
          bad=$(find scripts -type f \( -name "*.ps1" -o -name "*.psm1" \) -print0 \
                | xargs -0 grep -lP '[^\x00-\x7f]' || true)
          if [ -n "$bad" ]; then
            echo "::error::Non-ASCII content in PowerShell scripts. Windows PowerShell 5.1 cannot reliably parse UTF-8 without a BOM; use ASCII sentinels like [OK]/[FAIL]/[INFO] instead of Unicode glyphs."
            echo "Offending files:"
            echo "$bad"
            for f in $bad; do
              echo "--- $f ---"
              grep -nP '[^\x00-\x7f]' "$f" | head -5
            done
            exit 1
          fi
          echo "All PowerShell scripts are ASCII-clean."

      - name: Run Ruff (lint)
        run: uv run ruff check src/ tests/ --output-format=github

      - name: Run Ruff (format check)
        run: uv run ruff format --check src/ tests/

  # ============================================
  # Unit Tests
  # ============================================
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v --cov=src/bot_mmorpg --cov-report=xml --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  # ============================================
  # Security Scan
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install safety

      - name: Check for security vulnerabilities
        run: safety check --full-report

  # ============================================
  # Build Check
  # ============================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install build dependencies
        run: pip install build hatchling

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
