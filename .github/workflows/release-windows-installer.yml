name: Release

on:
  # Push a tag like v0.1.6 (or v1.2.3) to create a public GitHub Release + attach installer EXE
  push:
    tags:
      - "v*"
  # Manual run support (type a version like v0.1.6)
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: "always"

jobs:
  # Gate the release on the Python test suite so a tag push with broken code
  # can never ship an installer to users.
  test-before-release:
    name: Run tests before building installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q

  create-release:
    name: Create Release
    needs: test-before-release
    runs-on: ubuntu-latest
    outputs:
      # `version` is the user-facing tag form (e.g. v0.2.2). Used for the
      # GitHub release tag_name and the artifact zip name.
      version: ${{ steps.get_version.outputs.version }}
      # `semver` is the strict-semver form (e.g. 0.2.2). Used to override
      # tauri.conf.json's package.version so the installer filename embeds
      # the real release version (BOT-MMORPG-AI_0.2.2_x64-setup.exe) instead
      # of the static "1.0.0" baked into tauri.conf.json.
      semver: ${{ steps.get_version.outputs.semver }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          # User-facing form keeps the leading v
          if [[ "$VERSION" != v* ]]; then
            VERSION="v$VERSION"
          fi

          # Tauri's package.version expects strict semver (no leading v).
          SEMVER="${VERSION#v}"
          if ! [[ "$SEMVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::Tag '$VERSION' does not yield a valid semver ('$SEMVER'). Use vMAJOR.MINOR.PATCH[-prerelease][+build]."
            exit 1
          fi

          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER"    >> "$GITHUB_OUTPUT"
          echo "Tag version: $VERSION"
          echo "Semver: $SEMVER"

      # No deprecated set-output warnings (uses modern action)
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: BOT MMORPG AI ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## BOT MMORPG AI ${{ steps.get_version.outputs.version }}

            ### Installation Instructions

            1. **Download the installer** for your platform below
            2. **Run the installer** with administrator privileges
            3. **Follow the setup wizard** - it will automatically install required drivers
            4. **Launch the application** from your desktop or start menu

            ### What's Included

            - ✅ AI Bot Application with GUI
            - ✅ Python Backend (bundled)
            - ✅ Automatic Driver Installation (Interception + vJoy)
            - ✅ Desktop & Start Menu Shortcuts
            - ✅ Easy Uninstaller

            ### System Requirements

            - **OS**: Windows 10/11 (64-bit)
            - **RAM**: 8GB minimum, 16GB recommended
            - **GPU**: NVIDIA GPU recommended for training
            - **Disk**: 5GB free space

            ### Quick Start

            1. Launch the application
            2. Click "Collect Data" and play your game for 10-15 minutes
            3. Click "Train Model" and wait for training to complete
            4. Click "Start Bot" to let the AI play!

            For detailed instructions, see the User Guide:
            https://github.com/${{ github.repository }}/blob/main/USAGE.md

            ### Support

            - 🐛 Report Issues: https://github.com/${{ github.repository }}/issues
            - 📖 Documentation: https://github.com/${{ github.repository }}

  build-windows-installer:
    name: Build Windows Installer + Upload EXE to Release
    needs: create-release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # IMPORTANT: align with your Windows packaging assumptions (Python 3.10)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      # Optional (your build_pipeline.ps1 already tries to ensure it, but keeping is fine)
      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version "^1.0" --force

      # Build everything using the pipeline script. -Version is injected so
      # the installer filename and the app's package.version both reflect the
      # release tag (e.g. v0.2.2 -> BOT-MMORPG-AI_0.2.2_x64-setup.exe).
      - name: Build installer (Tauri + NSIS)
        shell: pwsh
        env:
          BOT_RELEASE_SEMVER: ${{ needs.create-release.outputs.semver }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_pipeline.ps1 -Version "$env:BOT_RELEASE_SEMVER"

      # Post-build verification. Fails the release if resources/python,
      # resources/backend, resources/modelhub, or resources/versions are
      # missing -- the root cause of issues #26, #37, #42 on v0.1.8/v0.2.0.
      - name: Verify installer contents
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify_installer.ps1

      # Sanity check: the bundled NSIS exe filename must contain the semver.
      # Catches any future regression in the version-injection chain.
      - name: Assert installer filename contains release version
        shell: pwsh
        env:
          BOT_RELEASE_SEMVER: ${{ needs.create-release.outputs.semver }}
        run: |
          $expected = $env:BOT_RELEASE_SEMVER
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No installer EXE found in bundle dir" }
          if ($exe.Name -notmatch [Regex]::Escape($expected)) {
            throw ("Installer filename '$($exe.Name)' does not contain the expected release version '$expected'. " +
                   "Did the -Version override flow break?")
          }
          Write-Host "[OK] Installer filename matches release version: $($exe.Name)"

      - name: Find NSIS installer EXE
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) { throw "No installer executable found in src-tauri/target/release/bundle/nsis" }

          "path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($installer.Name)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "Installer: $($installer.FullName)"

      # This makes the installer show up as an EXE under Release -> Assets
      - name: Upload installer EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: ${{ steps.installer.outputs.path }}
          fail_on_unmatched_files: true

      # Optional: keep an Actions artifact too (Actions will show it as a zip; Release will have the EXE)
      - name: Upload installer artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ needs.create-release.outputs.version }}
          path: ${{ steps.installer.outputs.path }}
          retention-days: 90
