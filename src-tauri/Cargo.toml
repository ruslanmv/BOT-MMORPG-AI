# src-tauri/Cargo.toml
[package]
name = "bot-mmorpg-ai"
version = "1.0.0"
description = "BOT MMORPG AI"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "shell-open", "shell-execute", "fs-read-file", "fs-write-file", "fs-read-dir", "fs-create-dir", "fs-exists"] }
urlencoding = "2"

# JSON + (de)serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for talking to modelhub/tauri.py local API (127.0.0.1)
# - "json" enables convenient .json() (de)serialization
# - "rustls-tls" avoids depending on native OpenSSL on Windows
# - "gzip"/"brotli" are optional but commonly useful; safe to include
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }

# Needed by reqwest async client + general async tasks in Tauri commands
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Unpack the packed python runtime archive (python-runtime.zip) on first launch.
# Using default-features=false disables `bzip2`/`time`/`deflate64` to keep the
# binary small; `deflate` is the compression used by Compress-Archive on the
# build side.
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# Proper semver comparison for the GitHub-releases update checker.
# Without this we'd be doing string compares which break on pre-release
# tags like "0.2.1-rc.1" vs "0.2.1".
semver = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
